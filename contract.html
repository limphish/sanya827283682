<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scarlet Night · Документ</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Roboto:wght@300;400;500&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-1: #050505;
            --bg-2: #160606;
            --accent-1: #d4af37;
            --accent-2: #b71c1c;
            --muted: #e9ddd2;
            --card-bg: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            --glow: 0 8px 40px rgba(212,175,55,0.06);
            --nav-height: 72px;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: radial-gradient(circle at 30% 30%, rgba(183,28,28,0.2), transparent 70%), var(--bg-1);
            color: var(--muted);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 70% 20%, rgba(212,175,55,0.1), rgba(22,6,6,0.3) 60%);
            opacity: 0.2;
            pointer-events: none;
            z-index: -1;
            animation: breath 10s infinite alternate;
        }

        @keyframes breath {
            0% { opacity: 0.15; transform: scale(1); }
            100% { opacity: 0.3; transform: scale(1.05); }
        }

        /* шапка (как в референсе — минимализм) */
        header {
            position: sticky;
            top: 0;
            width: 100%;
            height: var(--nav-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: rgba(5,5,5,0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212,175,55,0.1);
            z-index: 100;
            transition: all 0.3s;
        }

        .logo h1 {
            font-family: 'Playfair Display', serif;
            color: var(--accent-1);
            font-size: 1.6rem;
            letter-spacing: 1.5px;
        }
        .logo .sub {
            font-size: 0.7rem;
            color: #a88f6e;
        }

        nav a {
            color: var(--muted);
            text-decoration: none;
            margin-left: 24px;
            font-weight: 400;
            transition: color 0.2s;
            font-size: 0.95rem;
        }
        nav a:hover {
            color: var(--accent-1);
        }

        .container {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* карточка для PDF — та же люксовая полупрозрачная */
        .pdf-card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(212,175,55,0.1);
            border-radius: 32px;
            padding: 30px;
            box-shadow: var(--glow), 0 20px 60px rgba(0,0,0,0.7);
            transition: border-color 0.4s ease;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .pdf-card:hover {
            border-color: rgba(212,175,55,0.2);
        }

        /* шапка документа — только иконка и название */
        .pdf-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px dashed rgba(212,175,55,0.3);
        }

        .pdf-header i {
            font-size: 2.8rem;
            color: var(--accent-1);
            opacity: 0.9;
        }

        .pdf-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--accent-1);
            letter-spacing: 1px;
        }

        .pdf-header h2 span {
            font-family: 'Roboto', sans-serif;
            font-size: 0.9rem;
            color: #a88f6e;
            margin-left: 12px;
            font-weight: 300;
        }

        /* область отображения PDF */
        .pdf-viewer {
            width: 100%;
            height: 70vh;  /* высота под основной контент */
            min-height: 500px;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(212,175,55,0.15);
        }

        .pdf-viewer object {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* информационное сообщение, если PDF не загрузится (почти незаметное) */
        .pdf-fallback {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: rgba(233,221,210,0.4);
        }
        .pdf-fallback a {
            color: var(--accent-1);
            text-decoration: none;
            border-bottom: 1px dotted;
        }

        footer {
            background: #0f0404;
            text-align: center;
            padding: 24px;
            border-top: 1px solid rgba(212,175,55,0.05);
            color: #887e72;
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            header {
                padding: 0 16px;
            }
            nav a {
                margin-left: 15px;
                font-size: 0.85rem;
            }
            .pdf-card {
                padding: 20px;
            }
            .pdf-header h2 {
                font-size: 1.5rem;
            }
            .pdf-header h2 span {
                display: block;
                margin-left: 0;
                margin-top: 5px;
            }
        }

        @media (max-width: 500px) {
            .logo h1 {
                font-size: 1.2rem;
            }
            nav a {
                margin-left: 10px;
                font-size: 0.75rem;
            }
            .pdf-viewer {
                height: 60vh;
                min-height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>

    <!-- шапка — только самое нужное, без лишнего текста -->
    <header>
        <div class="logo">
            <h1>Scarlet Night</h1>
            <div class="sub">Luxury Escort · Documents</div>
        </div>
        <nav>
            <a href="https://ScarletN.com">Главная</a>
            <a href="https://t.me/ScarletN_Bot">Заказать</a>
            <a href="https://t.me/ScarletNight_SupportBot">Поддержка</a>
        </nav>
    </header>

    <main class="container">
        <div class="pdf-card">
            <!-- мини-шапка внутри карточки: просто иконка и название файла, без текста соглашения -->
            <div class="pdf-header">
                <i class="fas fa-file-pdf"></i>
                <h2>contract.pdf <span>официальный документ</span></h2>
            </div>

            <!-- сам PDF, встроенный в страницу (файл должен лежать рядом с index.html) -->
            <div class="pdf-viewer">
                <object type="application/pdf" data="contract.pdf#view=FitH&toolbar=1&navpanes=1">
                    <!-- если браузер не может отобразить PDF, покажет ссылку на скачивание (почти незаметно) -->
                    <p class="pdf-fallback">
                        <i class="fas fa-download"></i> 
                        <a href="contract.pdf">Скачать contract.pdf</a>
                    </p>
                </object>
            </div>
        </div>
    </main>

    <footer>
        <p>Официальный сайт агентства • <span>Scarlet Night © 2026</span> • Политика конфиденциальности</p>
    </footer>
</body>
</html>
